<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Máquina de Frases - Desenhos da Turma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body { font-family: 'Fredoka', sans-serif; background: #f0f9ff; }
    .card-slot { transition: all 0.2s ease; }
    .card-slot:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6 text-slate-800">
  <div class="max-w-7xl mx-auto">
    <!-- Cabeçalho -->
    <header class="bg-white rounded-3xl shadow-md p-5 mb-6 flex flex-wrap items-center justify-between gap-4 border-b-4 border-sky-400">
      <div>
        <h1 class="text-2xl md:text-4xl font-bold text-sky-600">🤖 Máquina de Frases</h1>
        <p class="text-slate-500 text-sm md:text-base">Escolha um desenho ou escreva palavras nas caixinhas para montar e ouvir a frase!</p>
      </div>
      <div class="flex gap-2">
        <button onclick="limparTudo()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold px-4 py-2 rounded-2xl transition">
          🗑️ Limpar
        </button>
        <button onclick="lerFrase()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-3 rounded-2xl shadow-lg text-lg transition flex items-center gap-2">
          🔊 Ler Frase
        </button>
      </div>
    </header>

    <!-- Palco da Frase (4 Caixinhas) -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <!-- Quem (Sujeito) -->
      <div class="card-slot bg-amber-50 border-4 border-amber-400 rounded-3xl p-4 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <span class="bg-amber-400 text-amber-950 font-bold px-3 py-1 rounded-full text-sm">1. QUEM? (Sujeito)</span>
          <span class="text-2xl">🧑</span>
        </div>
        <div id="preview-quem" class="h-36 bg-white rounded-2xl border-2 border-dashed border-amber-300 flex items-center justify-center overflow-hidden mb-3">
          <span class="text-slate-400 text-sm text-center px-2">Selecione um desenho abaixo</span>
        </div>
        <input id="input-quem" type="text" placeholder="Ex: O Lucas, A Maria..." class="w-full px-3 py-2 rounded-xl border-2 border-amber-300 focus:outline-none focus:border-amber-500 font-semibold text-lg bg-white" oninput="atualizarFrase()" />
      </div>

      <!-- Faz o quê (Verbo/Ação) -->
      <div class="card-slot bg-sky-50 border-4 border-sky-400 rounded-3xl p-4 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <span class="bg-sky-400 text-sky-950 font-bold px-3 py-1 rounded-full text-sm">2. FAZ O QUÊ? (Ação)</span>
          <span class="text-2xl">⚡</span>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-3">
          <button onclick="setPalavra('input-acao', 'pulou')" class="bg-white hover:bg-sky-100 border border-sky-300 px-2.5 py-1 rounded-lg text-sm font-semibold">pulou</button>
          <button onclick="setPalavra('input-acao', 'correu')" class="bg-white hover:bg-sky-100 border border-sky-300 px-2.5 py-1 rounded-lg text-sm font-semibold">correu</button>
          <button onclick="setPalavra('input-acao', 'desenhou')" class="bg-white hover:bg-sky-100 border border-sky-300 px-2.5 py-1 rounded-lg text-sm font-semibold">desenhou</button>
          <button onclick="setPalavra('input-acao', 'brincou')" class="bg-white hover:bg-sky-100 border border-sky-300 px-2.5 py-1 rounded-lg text-sm font-semibold">brincou</button>
          <button onclick="setPalavra('input-acao', 'comeu')" class="bg-white hover:bg-sky-100 border border-sky-300 px-2.5 py-1 rounded-lg text-sm font-semibold">comeu</button>
          <button onclick="setPalavra('input-acao', 'cantou')" class="bg-white hover:bg-sky-100 border border-sky-300 px-2.5 py-1 rounded-lg text-sm font-semibold">cantou</button>
        </div>
        <input id="input-acao" type="text" placeholder="Ex: pulou, dançou..." class="w-full px-3 py-2 rounded-xl border-2 border-sky-300 focus:outline-none focus:border-sky-500 font-semibold text-lg bg-white" oninput="atualizarFrase()" />
      </div>

      <!-- O quê / Com quem (Complemento) -->
      <div class="card-slot bg-purple-50 border-4 border-purple-400 rounded-3xl p-4 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <span class="bg-purple-400 text-purple-950 font-bold px-3 py-1 rounded-full text-sm">3. O QUÊ?</span>
          <span class="text-2xl">🎈</span>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-3">
          <button onclick="setPalavra('input-oque', 'uma bola')" class="bg-white hover:bg-purple-100 border border-purple-300 px-2.5 py-1 rounded-lg text-sm font-semibold">uma bola</button>
          <button onclick="setPalavra('input-oque', 'um bolo')" class="bg-white hover:bg-purple-100 border border-purple-300 px-2.5 py-1 rounded-lg text-sm font-semibold">um bolo</button>
          <button onclick="setPalavra('input-oque', 'com o amigo')" class="bg-white hover:bg-purple-100 border border-purple-300 px-2.5 py-1 rounded-lg text-sm font-semibold">com o amigo</button>
          <button onclick="setPalavra('input-oque', 'bem alto')" class="bg-white hover:bg-purple-100 border border-purple-300 px-2.5 py-1 rounded-lg text-sm font-semibold">bem alto</button>
        </div>
        <input id="input-oque" type="text" placeholder="Ex: uma maçã..." class="w-full px-3 py-2 rounded-xl border-2 border-purple-300 focus:outline-none focus:border-purple-500 font-semibold text-lg bg-white" oninput="atualizarFrase()" />
      </div>

      <!-- Onde (Lugar) -->
      <div class="card-slot bg-emerald-50 border-4 border-emerald-400 rounded-3xl p-4 shadow-sm flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <span class="bg-emerald-400 text-emerald-950 font-bold px-3 py-1 rounded-full text-sm">4. ONDE? (Lugar)</span>
          <span class="text-2xl">🏡</span>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-3">
          <button onclick="setPalavra('input-onde', 'na escola')" class="bg-white hover:bg-emerald-100 border border-emerald-300 px-2.5 py-1 rounded-lg text-sm font-semibold">na escola</button>
          <button onclick="setPalavra('input-onde', 'no parque')" class="bg-white hover:bg-emerald-100 border border-emerald-300 px-2.5 py-1 rounded-lg text-sm font-semibold">no parque</button>
          <button onclick="setPalavra('input-onde', 'em casa')" class="bg-white hover:bg-emerald-100 border border-emerald-300 px-2.5 py-1 rounded-lg text-sm font-semibold">em casa</button>
          <button onclick="setPalavra('input-onde', 'na praia')" class="bg-white hover:bg-emerald-100 border border-emerald-300 px-2.5 py-1 rounded-lg text-sm font-semibold">na praia</button>
        </div>
        <input id="input-onde" type="text" placeholder="Ex: no jardim..." class="w-full px-3 py-2 rounded-xl border-2 border-emerald-300 focus:outline-none focus:border-emerald-500 font-semibold text-lg bg-white" oninput="atualizarFrase()" />
      </div>
    </section>

    <!-- Resultado da Frase -->
    <section class="bg-white rounded-3xl shadow-md p-6 mb-6 border-4 border-indigo-200 text-center">
      <p class="text-xs uppercase tracking-wider font-bold text-indigo-400 mb-1">Frase Montada:</p>
      <div id="frase-final" class="text-2xl md:text-4xl font-bold text-slate-800 min-h-[3rem] flex items-center justify-center">
        ...
      </div>
    </section>

    <!-- Galeria de Desenhos da Turma -->
    <section class="bg-white rounded-3xl shadow-md p-6">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <h2 class="text-xl md:text-2xl font-bold text-slate-700">🎨 Desenhos da Turma (<span id="contador-desenhos">0</span>)</h2>
        <span id="status-galeria" class="text-sm text-slate-500">Carregando desenhos...</span>
      </div>
      <div id="galeria" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-8 lg:grid-cols-10 gap-3"></div>
    </section>
  </div>

  <script>
    let imagemSelecionada = "";

    function setPalavra(id, texto) {
      document.getElementById(id).value = texto;
      atualizarFrase();
    }

    function atualizarFrase() {
      const partes = [
        document.getElementById("input-quem").value.trim(),
        document.getElementById("input-acao").value.trim(),
        document.getElementById("input-oque").value.trim(),
        document.getElementById("input-onde").value.trim()
      ].filter(Boolean);

      const el = document.getElementById("frase-final");
      if (partes.length === 0) {
        el.textContent = "...";
      } else {
        let frase = partes.join(" ");
        frase = frase.charAt(0).toUpperCase() + frase.slice(1) + ".";
        el.textContent = frase;
      }
    }

    function lerFrase() {
      const texto = document.getElementById("frase-final").textContent;
      if (!texto || texto === "...") return;
      window.speechSynthesis.cancel();
      const fala = new SpeechSynthesisUtterance(texto);
      fala.lang = "pt-BR";
      fala.rate = 0.95;
      window.speechSynthesis.speak(fala);
    }

    function limparTudo() {
      document.getElementById("input-quem").value = "";
      document.getElementById("input-acao").value = "";
      document.getElementById("input-oque").value = "";
      document.getElementById("input-onde").value = "";
      imagemSelecionada = "";
      document.getElementById("preview-quem").innerHTML = '<span class="text-slate-400 text-sm text-center px-2">Selecione um desenho abaixo</span>';
      atualizarFrase();
    }

    function selecionarDesenho(caminho, nomeArquivo) {
      imagemSelecionada = caminho;
      document.getElementById("preview-quem").innerHTML = `<img src="${caminho}" alt="${nomeArquivo}" class="h-full w-full object-contain p-1" />`;
      const inputQuem = document.getElementById("input-quem");
      if (!inputQuem.value.trim()) {
        inputQuem.focus();
      }
      atualizarFrase();
    }

    // Carrega EXCLUSIVAMENTE a partir de desenhos/lista.json (zero tentativas aleatórias)
    async function carregarDesenhos() {
      const galeria = document.getElementById("galeria");
      const status = document.getElementById("status-galeria");
      const contador = document.getElementById("contador-desenhos");

      try {
        const resp = await fetch("desenhos/lista.json?v=" + Date.now());
        if (!resp.ok) throw new Error("lista.json não encontrado");
        const arquivos = await resp.json();

        if (!Array.isArray(arquivos) || arquivos.length === 0) {
          status.textContent = "Nenhum desenho listado em desenhos/lista.json.";
          return;
        }

        contador.textContent = arquivos.length;
        status.textContent = "Clique em um desenho para colocar no Sujeito";

        arquivos.forEach((nome) => {
          const caminho = `desenhos/${nome}`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "group bg-slate-50 hover:bg-amber-50 border-2 border-slate-200 hover:border-amber-400 rounded-2xl p-1.5 flex flex-col items-center transition shadow-sm";
          btn.onclick = () => selecionarDesenho(caminho, nome);

          const img = document.createElement("img");
          img.src = caminho;
          img.alt = nome;
          img.loading = "lazy";
          img.className = "w-full aspect-square object-cover rounded-xl mb-1";

          const label = document.createElement("span");
          label.className = "text-[11px] font-semibold text-slate-600 truncate w-full text-center";
          label.textContent = nome.replace(/\.[^/.]+$/, "");

          btn.appendChild(img);
          btn.appendChild(label);
          galeria.appendChild(btn);
        });
      } catch (err) {
        status.textContent = "Erro ao carregar desenhos/lista.json.";
        console.error(err);
      }
    }

    carregarDesenhos();
  </script>
</body>
</html>
